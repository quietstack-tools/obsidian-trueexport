name: Bug report
description: Something in TrueExport isn't working as expected (not an export fidelity issue)
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: TrueExport version / Obsidian version / OS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant console output or errors
      render: shell
    validations:
      required: false
