name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Assert build output is not minified
        run: |
          LINES=$(wc -l < main.js)
          if [ "$LINES" -lt 20 ]; then
            echo "main.js has $LINES lines — looks minified. Obsidian rejects minified code."
            exit 1
          fi
          echo "Build output OK ($LINES lines)"
